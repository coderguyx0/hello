<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unser Date</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* Globale Styles */
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto; /* Wichtig: Erlaubt das Scrollen nach unten */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fff0f5 0%, #ffffff 100%);
            color: #d63384;
        }

        /* Sprachauswahl */
        #language-selection {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fff0f5 0%, #ffffff 100%);
        }

        .lang-card {
            background: white;
            border: 3px solid #d63384;
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(214, 51, 132, 0.25);
            max-width: 320px;
            width: 90%;
        }

        .lang-options {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }

        .btn-lang {
            font-size: 3rem;
            background: none;
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 10px;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .btn-lang:hover {
            transform: scale(1.15);
            border-color: #ffc1e6;
            background: #fff0f5;
        }

        /* Hauptbereich */
        #main-content {
            display: none;
            width: 100%;
            min-height: 100vh;
            position: relative;
            flex-direction: column;
            align-items: center;
            padding: 5vh 20px 10vh 20px; /* Viel Platz nach unten für das Scrollen */
            box-sizing: border-box;
            z-index: 10;
        }

        h1 {
            color: #d63384;
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 40px;
            text-shadow: 0 4px 10px rgba(214, 51, 132, 0.15);
            line-height: 1.2;
        }

        h2 {
            color: #d63384;
            text-align: center;
            font-weight: 600;
            margin-bottom: 30px;
        }

        /* Buttons Container */
        .btn-container {
            position: relative;
            width: 100%;
            max-width: 350px;
            display: flex;
            justify-content: center; /* Setzt beide Buttons nebeneinander */
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-ja {
            background: #d63384;
            color: white;
            padding: 18px 50px;
            border-radius: 50px;
            font-size: 1.3rem;
            box-shadow: 0 10px 25px rgba(214, 51, 132, 0.4);
            z-index: 5;
            transition: all 0.3s ease;
        }

        /* Der FLUTSCHIGE Drippy Nein Button (Wasser-Effekt) */
        .btn-nein {
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            color: white;
            padding: 15px 35px;
            font-size: 1.1rem;
            /* Wasser-Tropfen Form (Blob) */
            border-radius: 40% 60% 50% 50% / 50% 50% 60% 40%;
            box-shadow: inset 3px 5px 10px rgba(255,255,255,0.6), 0 10px 20px rgba(116, 235, 213, 0.4);
            transition: left 0.3s ease-out, top 0.3s ease-out, transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 999; /* Damit er beim Fliehen über allem liegt */
            animation: waterWobble 3s ease-in-out infinite;
        }

        @keyframes waterWobble {
            0% { border-radius: 40% 60% 50% 50% / 50% 50% 60% 40%; }
            50% { border-radius: 60% 40% 60% 40% / 40% 60% 50% 50%; }
            100% { border-radius: 40% 60% 50% 50% / 50% 50% 60% 40%; }
        }

        /* Aktivität Auswahl */
        .activity-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 350px;
        }

        .btn-activity {
            background: white;
            color: #d63384;
            padding: 20px;
            border-radius: 20px;
            font-size: 1.2rem;
            box-shadow: 0 8px 20px rgba(214, 51, 132, 0.1);
            border: 2px solid #ffc1e6;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-activity:active {
            transform: scale(0.96);
            background: #fff0f5;
            border-color: #d63384;
        }

        /* Formular */
        #form-view {
            display: none;
            width: 100%;
            max-width: 350px;
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(214, 51, 132, 0.15);
            animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            border: 1px solid #ffc1e6;
            box-sizing: border-box;
            margin-bottom: 50px;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: translateY(0); } }

        label {
            display: block;
            margin-bottom: 8px;
            color: #d63384;
            font-weight: bold;
            font-size: 1rem;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #ffc1e6;
            border-radius: 15px;
            font-size: 1.1rem;
            box-sizing: border-box;
            color: #333;
            background: #fff9fc;
        }
        
        input:focus {
            border-color: #d63384;
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(214, 51, 132, 0.1);
        }

        .btn-submit {
            width: 100%;
            background: #d63384;
            color: white;
            padding: 18px;
            border-radius: 50px;
            font-size: 1.2rem;
            box-shadow: 0 10px 20px rgba(214, 51, 132, 0.3);
            margin-top: 10px;
        }
        
        /* UHRZEIT WÄHLER */
        .time-slots-container {
            display: none; 
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }

        .time-slot-btn {
            background: white;
            border: 2px solid #ffc1e6;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            color: #555;
            font-size: 1rem;
            transition: all 0.2s;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }

        .time-slot-btn:hover {
            background: #fff0f5;
            border-color: #d63384;
        }

        .time-slot-btn.selected {
            background: #d63384;
            color: white;
            border-color: #d63384;
        }

        /* Animationen */
        .fade-in { animation: fadeIn 0.8s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        /* Responsive Anpassungen */
        @media (max-width: 400px) {
            h1 { font-size: 1.8rem; }
            .btn-ja { padding: 15px 40px; font-size: 1.2rem; }
            .btn-nein { padding: 12px 30px; font-size: 1rem; }
            .lang-card { padding: 30px; }
        }
    </style>
</head>
<body>

    <!-- Sprachauswahl -->
    <div id="language-selection">
        <div class="lang-card">
            <h2 id="lang-text">Wähle deine Sprache</h2>
            <div class="lang-options">
                <button class="btn-lang" onclick="setLanguage('de')">🇩🇪</button>
                <button class="btn-lang" onclick="setLanguage('en')">🇬🇧</button>
            </div>
        </div>
    </div>

    <!-- Hauptinhalt -->
    <div id="main-content">
        
        <!-- Screen 1: Ja/Nein -->
        <div id="screen-1" class="fade-in">
            <h1 id="main-question">Willst du mit mir<br>auf ein Date gehen?</h1>
            
            <div class="btn-container">
                <button class="btn-ja" id="btn-ja-1" onclick="handleYes()">JA</button>
                <!-- Der flutschige Wasser-Nein Button -->
                <button class="btn-nein" id="btnNein" 
                        ontouchstart="flinchNein()" 
                        onmouseover="flinchNein()">
                    <span id="text-no">NEIN</span>
                </button>
            </div>
        </div>

        <!-- Screen 2: Aktivität -->
        <div id="screen-2" style="display: none; width: 100%; text-align: center; padding: 20px 0;">
            <h2 id="activity-title">Was wollen wir machen?</h2>
            <div class="activity-options">
                <button class="btn-activity" onclick="selectActivity('cafe')">
                    <span id="activity-1-icon">☕</span> <span id="activity-1-text">Cafe trinken gehen</span>
                </button>
                <button class="btn-activity" onclick="selectActivity('walk')">
                    <span id="activity-2-icon">🌳</span> <span id="activity-2-text">Spazieren gehen</span>
                </button>
            </div>
        </div>

        <!-- Screen 3: Formular mit Datum & Uhrzeit -->
        <div id="form-view">
            <h2 id="form-title" style="margin-top: 0;">Ein letzter Schritt...</h2>
            
            <label for="nameInput" id="label-name">Dein Name</label>
            <input type="text" id="nameInput" placeholder="Dein Name" required>

            <label for="ageInput" id="label-age">Dein Alter</label>
            <input type="number" id="ageInput" placeholder="Dein Alter" required>

            <label for="dateInput" id="label-date">Wann passt es dir?</label>
            <input type="date" id="dateInput" required onchange="updateTimeSlots()">

            <!-- UHRZEITEN WÄHLER -->
            <div id="timePickerContainer" class="time-slots-container">
                <p style="text-align:center; color:#888; font-size:0.9rem; margin:0 0 10px 0;" id="time-label">Wähle eine Zeit:</p>
                <div class="time-slot-btn" onclick="selectTime('10:00 Uhr')">10:00 Uhr</div>
                <div class="time-slot-btn" onclick="selectTime('12:00 Uhr')">12:00 Uhr</div>
                <div class="time-slot-btn" onclick="selectTime('14:00 Uhr')">14:00 Uhr</div>
                <div class="time-slot-btn" onclick="selectTime('16:00 Uhr')">16:00 Uhr</div>
                <div class="time-slot-btn" onclick="selectTime('18:00 Uhr')">18:00 Uhr</div>
                <div class="time-slot-btn" onclick="selectTime('20:00 Uhr')">20:00 Uhr</div>
                <div class="time-slot-btn" onclick="selectTime('21:00 Uhr')">21:00 Uhr</div>
            </div>

            <button class="btn-submit" id="btn-submit" onclick="submitAndRedirect()">Abschicken & WhatsApp öffnen</button>
        </div>

    </div>

    <script>
        const translations = {
            de: {
                langTitle: "Wähle deine Sprache",
                mainQuestion: "Willst du mit mir<br>auf ein Date gehen?",
                btnYes: "JA",
                btnNo: "NEIN",
                activityTitle: "Was wollen wir machen?",
                act1: "☕ Cafe trinken gehen",
                act2: "🌳 Spazieren gehen",
                formTitle: "Ein letzter Schritt...",
                labelName: "Dein Name",
                placeholderName: "Dein Name",
                labelAge: "Dein Alter",
                placeholderAge: "Dein Alter",
                labelDate: "Wann passt es dir?",
                btnSubmit: "Abschicken & WhatsApp öffnen",
                msgPrefix: "Ich bin bereit für",
                timeLabel: "Wähle eine Uhrzeit:"
            },
            en: {
                langTitle: "Choose your language",
                mainQuestion: "Do you want to go<br>on a date with me?",
                btnYes: "YES",
                btnNo: "NO",
                activityTitle: "What should we do?",
                act1: "☕ Go for a Coffee",
                act2: "🌳 Go for a Walk",
                formTitle: "Just one last step...",
                labelName: "Your Name",
                placeholderName: "Your Name",
                labelAge: "Your Age",
                placeholderAge: "Your Age",
                labelDate: "When are you free?",
                btnSubmit: "Submit & Open WhatsApp",
                msgPrefix: "I'm ready for",
                timeLabel: "Choose a time:"
            }
        };

        let currentLang = "de";
        let selectedActivity = "";
        let selectedTime = "";

        // 1. Sprachauswahl
        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.getElementById('lang-text').textContent = t.langTitle;
            document.getElementById('main-question').innerHTML = t.mainQuestion;
            document.getElementById('btn-ja-1').textContent = t.btnYes;
            document.getElementById('text-no').textContent = t.btnNo;
            document.getElementById('activity-title').textContent = t.activityTitle;
            document.getElementById('activity-1-text').textContent = t.act1;
            document.getElementById('activity-2-text').textContent = t.act2;
            document.getElementById('form-title').textContent = t.formTitle;
            document.getElementById('label-name').textContent = t.labelName;
            document.getElementById('nameInput').placeholder = t.placeholderName;
            document.getElementById('label-age').textContent = t.labelAge;
            document.getElementById('ageInput').placeholder = t.placeholderAge;
            document.getElementById('label-date').textContent = t.labelDate;
            document.getElementById('btn-submit').textContent = t.btnSubmit;
            document.getElementById('time-label').textContent = t.timeLabel;

            document.getElementById('language-selection').style.display = 'none';
            document.getElementById('main-content').style.display = 'flex';
        }

        // 2. JA Button (mit Konfetti)
        function handleYes() {
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                shapes: ['heart'],
                colors: ['#ff69b4', '#ff1493', '#ff82ab', '#ff66b2', '#ffb8c2'],
                scalar: 1.2,
                drift: 0.5,
                ticks: 300
            });

            showActivitySelection();
        }

        // 3. NEIN Button Flutsch-Effekt
        function flinchNein(event) {
            const btn = document.getElementById('btnNein');
            
            // Reißt sich vom Layout los, damit das 'Ja' zentriert wird und der Button wild fliegen kann
            if (btn.style.position !== 'fixed') {
                btn.style.position = 'fixed';
            }

            // Sicherstellen, dass er innerhalb des sichtbaren Fensters bleibt
            const padding = 20;
            const btnWidth = btn.offsetWidth || 100;
            const btnHeight = btn.offsetHeight || 50;
            
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const randomX = Math.max(padding, Math.random() * maxX);
            const randomY = Math.max(padding, Math.random() * maxY);

            // Setzt die neuen Koordinaten
            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';

            // Erzeugt den "Squish" Wasser-Effekt
            btn.style.transform = 'scale(0.8) skew(15deg)';
            
            setTimeout(() => {
                btn.style.transform = 'scale(1) skew(0deg)';
            }, 250);
        }

        // 4. Navigation
        function showActivitySelection() {
            document.getElementById('screen-1').style.display = 'none';
            const screen2 = document.getElementById('screen-2');
            screen2.style.display = 'flex';
            screen2.style.flexDirection = 'column';
            screen2.style.alignItems = 'center';
            screen2.style.animation = 'fadeIn 0.5s ease';
        }

        function selectActivity(type) {
            if(type === 'cafe') selectedActivity = translations[currentLang].act1;
            if(type === 'walk') selectedActivity = translations[currentLang].act2;

            document.getElementById('screen-2').style.display = 'none';
            document.getElementById('form-view').style.display = 'block';
        }

        // 5. Logik für Uhrzeit & Datum (und Scroll-Fix)
        function updateTimeSlots() {
            const container = document.getElementById('timePickerContainer');
            container.style.display = 'flex';
            selectedTime = "";
            document.querySelectorAll('.time-slot-btn').forEach(btn => btn.classList.remove('selected'));
        }

        function selectTime(time) {
            selectedTime = time;
            document.querySelectorAll('.time-slot-btn').forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');

            // Scroll-Anpassung, die jetzt dank der reparierten Body-Struktur einwandfrei klappt
            setTimeout(() => {
                document.getElementById('form-view').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        // 6. WhatsApp Weiterleitung
        function submitAndRedirect() {
            const name = document.getElementById('nameInput').value;
            const age = document.getElementById('ageInput').value;
            const date = document.getElementById('dateInput').value;

            if(!name || !age || !date) {
                alert(currentLang === 'de' ? "Bitte fülle alles aus! 😘" : "Please fill in everything! 😘");
                return;
            }
            
            if(!selectedTime) {
                alert(currentLang === 'de' ? "Bitte wähle auch eine Uhrzeit! ⏰" : "Please choose a time! ⏰");
                return;
            }

            // --- DEINE DATEN HIER ---
            const myNumber = "4915112345678"; 
            
            const message = `Hi! Ich bin ${name} (${age}).\n\n${translations[currentLang].msgPrefix} ${selectedActivity}! 😍\n\nAm ${date} um ${selectedTime}.`;
            
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${myNumber}?text=${encodedMessage}`;

            window.location.href = whatsappUrl;
        }
    </script>
</body>
</html>
