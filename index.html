<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Unser Date</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* Globale Styles */
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #fff0f5 0%, #ffffff 100%);
            color: #d63384;
        }

        /* DIESER TOAST BANNER BLEIBT GARANTIERT SIBHTBAR */
        .toast-popup {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #d63384;
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 10px 25px rgba(214, 51, 132, 0.4);
            z-index: 99999;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast-popup.show {
            top: 25px;
            opacity: 1;
        }

        /* Sprachauswahl */
        #language-selection {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fff0f5 0%, #ffffff 100%);
        }

        .lang-card {
            background: white;
            border: 3px solid #d63384;
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(214, 51, 132, 0.25);
            max-width: 320px;
            width: 90%;
        }

        .lang-options {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 20px;
        }

        .btn-lang {
            font-size: 3rem;
            background: none;
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 10px;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .btn-lang:hover {
            transform: scale(1.15);
            border-color: #ffc1e6;
            background: #fff0f5;
        }

        /* Hauptbereich */
        #main-content {
            display: none;
            width: 100%;
            min-height: 100vh;
            position: relative;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5vh 15px 10vh 15px;
            box-sizing: border-box;
            z-index: 10;
        }

        h1 {
            color: #d63384;
            text-align: center;
            font-size: 2.2rem;
            margin-bottom: 30px;
            text-shadow: 0 4px 10px rgba(214, 51, 132, 0.15);
            line-height: 1.2;
        }

        h2 {
            color: #d63384;
            text-align: center;
            font-weight: 600;
            margin-bottom: 30px;
        }

        /* Buttons Container */
        .btn-container {
            position: relative;
            width: 100%;
            max-width: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px auto 0 auto;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
        }

        /* Buttons für Freund-Frage */
        .btn-bf {
            flex: 1;
            padding: 16px 0;
            border-radius: 50px;
            font-size: 1.2rem;
            text-align: center;
            box-shadow: 0 10px 25px rgba(214, 51, 132, 0.3);
            transition: all 0.3s ease;
        }

        .btn-bf-nein {
            background: #ff69b4;
            color: white;
        }

        .btn-bf-ja {
            background: #d63384;
            color: white;
        }

        /* Buttons für Date-Frage */
        .btn-ja {
            background: #d63384;
            color: white;
            padding: 16px 40px;
            border-radius: 50px;
            font-size: 1.2rem;
            box-shadow: 0 10px 25px rgba(214, 51, 132, 0.4);
            z-index: 5;
            transition: all 0.3s ease;
        }

        /* FLUTSCHIGER NEIN BUTTON */
        .btn-nein {
            background: radial-gradient(circle at 30% 30%, #00e5ff, #0077ff);
            color: white;
            padding: 15px 35px;
            font-size: 1.1rem;
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            box-shadow: inset -4px -4px 10px rgba(0, 0, 0, 0.2), 
                        inset 4px 4px 10px rgba(255, 255, 255, 0.8),
                        0 10px 25px rgba(0, 119, 255, 0.4);
            transition: left 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        top 0.12s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        transform 0.1s ease-out,
                        border-radius 0.2s ease;
            z-index: 999;
            user-select: none;
            white-space: nowrap;
        }

        .water-splash {
            position: fixed;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, rgba(0,229,255,0.8) 0%, rgba(0,119,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: splashAnim 0.4s forwards ease-out;
            z-index: 998;
        }

        @keyframes splashAnim {
            0% { transform: scale(0.2); opacity: 1; border: 2px solid #00e5ff; }
            100% { transform: scale(2.8); opacity: 0; border: 0px solid transparent; }
        }

        /* Aktivität Auswahl */
        .activity-options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 350px;
            margin: 0 auto;
        }

        .btn-activity {
            background: white;
            color: #d63384;
            padding: 20px;
            border-radius: 20px;
            font-size: 1.2rem;
            box-shadow: 0 8px 20px rgba(214, 51, 132, 0.1);
            border: 2px solid #ffc1e6;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
        }

        .btn-activity:active {
            transform: scale(0.96);
            background: #fff0f5;
            border-color: #d63384;
        }

        /* Formular */
        #form-view {
            display: none;
            width: 100%;
            max-width: 360px;
            background: white;
            padding: 25px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(214, 51, 132, 0.15);
            animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            border: 1px solid #ffc1e6;
            box-sizing: border-box;
            margin: 0 auto 50px auto;
        }

        @keyframes slideUp { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: translateY(0); } }

        label {
            display: block;
            margin-bottom: 8px;
            color: #d63384;
            font-weight: bold;
            font-size: 1rem;
        }

        input {
            width: 100%;
            max-width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #ffc1e6;
            border-radius: 15px;
            font-size: 1rem;
            box-sizing: border-box;
            color: #333;
            background: #fff9fc;
            -webkit-appearance: none;
            appearance: none;
        }
        
        input:focus {
            border-color: #d63384;
            outline: none;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(214, 51, 132, 0.1);
        }

        .btn-submit {
            width: 100%;
            background: #d63384;
            color: white;
            padding: 18px;
            border-radius: 50px;
            font-size: 1.2rem;
            box-shadow: 0 10px 20px rgba(214, 51, 132, 0.3);
            margin-top: 10px;
        }

        .fade-in { animation: fadeIn 0.8s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        @media (max-width: 400px) {
            h1 { font-size: 1.8rem; }
            .btn-ja, .btn-bf { font-size: 1.1rem; }
            .btn-nein { padding: 12px 30px; font-size: 1rem; }
            .lang-card { padding: 30px; }
        }
    </style>
</head>
<body>

    <!-- TOAST POPUP BENACHRICHTIGUNG -->
    <div id="toast" class="toast-popup">Gute Entscheidung 😉</div>

    <!-- Sprachauswahl -->
    <div id="language-selection">
        <div class="lang-card">
            <h2 id="lang-text">Wähle deine Sprache</h2>
            <div class="lang-options">
                <button class="btn-lang" onclick="setLanguage('de')">🇩🇪</button>
                <button class="btn-lang" onclick="setLanguage('en')">🇬🇧</button>
            </div>
        </div>
    </div>

    <!-- Hauptinhalt -->
    <div id="main-content">
        
        <!-- Screen 0: Freund-Frage -->
        <div id="screen-boyfriend" class="fade-in" style="display: none; width: 100%; text-align: center;">
            <h1 id="boyfriend-question">Hast du einen Freund?</h1>
            <div class="btn-container">
                <button class="btn-bf btn-bf-nein" id="btn-bf-nein" onclick="handleBoyfriendNo()">NEIN</button>
                <button class="btn-bf btn-bf-ja" id="btn-bf-ja" onclick="handleBoyfriendYes()">JA</button>
            </div>
        </div>

        <!-- End-Screen falls sie einen Freund hat -->
        <div id="screen-boyfriend-end" class="fade-in" style="display: none; width: 100%; text-align: center;">
            <h1 id="boyfriend-end-text">Ich wünsche dir noch einen schönen Tag :)</h1>
        </div>

        <!-- Screen 1: Date Ja/Nein -->
        <div id="screen-1" class="fade-in" style="display: none; width: 100%; text-align: center;">
            <h1 id="main-question">Willst du mit mir<br>auf ein Date gehen?</h1>
            
            <div class="btn-container">
                <button class="btn-ja" id="btn-ja-1" onclick="handleYes()">JA</button>
                <button class="btn-nein" id="btnNein" 
                        ontouchstart="flinchNein()" 
                        onmouseover="flinchNein()">
                    <span id="text-no">NEIN</span>
                </button>
            </div>
        </div>

        <!-- Screen 2: Aktivität -->
        <div id="screen-2" style="display: none; width: 100%; text-align: center; padding: 20px 0;">
            <h2 id="activity-title">Was wollen wir machen?</h2>
            <div class="activity-options">
                <button class="btn-activity" onclick="selectActivity('cafe')">
                    <span id="activity-1-icon"></span> <span id="activity-1-text">☕ Cafe trinken gehen ☕</span>
                </button>
                <button class="btn-activity" onclick="selectActivity('walk')">
                    <span id="activity-2-icon"></span> <span id="activity-2-text">🌳 Spazieren gehen 🌳</span>
                </button>
            </div>
        </div>

        <!-- Screen 3: Formular -->
        <div id="form-view">
            <h2 id="form-title" style="margin-top: 0;">Ein letzter Schritt...</h2>
            
            <label for="nameInput" id="label-name">Dein Name</label>
            <input type="text" id="nameInput" placeholder="Dein Name" required>

            <label for="ageInput" id="label-age">Dein Alter</label>
            <input type="number" id="ageInput" placeholder="Dein Alter" required>

            <button class="btn-submit" id="btn-submit" onclick="submitAndRedirect()">Lass treffen!</button>
        </div>

    </div>

    <script>
        const translations = {
            de: {
                langTitle: "Wähle deine Sprache",
                boyfriendQuestion: "Hast du einen Freund?",
                boyfriendEndText: "Ich wünsche dir noch einen schönen Tag :)",
                mainQuestion: "Willst du mit mir<br>auf ein Date gehen?",
                btnYes: "JA",
                btnNo: "NEIN",
                activityTitle: "Was wollen wir machen?",
                act1: "☕ Cafe trinken gehen ☕",
                act2: "🌳 Spazieren gehen 🌳",
                formTitle: "Ein letzter Schritt...",
                labelName: "Dein Name",
                placeholderName: "Dein Name",
                labelAge: "Dein Alter",
                placeholderAge: "Dein Alter",
                btnSubmit: "Lass treffen!",
                msgPrefix: "Lass uns",
                toastMsg: "Gute Entscheidung 😉",
                taunts: [
                    "NEIN", 
                    "NEIN", 
                    "NEIN", 
                    "NEIN", 
                    "NEIN", 
                    "NEIN", 
                    "NEIN"
                ]
            },
            en: {
                langTitle: "Choose your language",
                boyfriendQuestion: "Do you have a boyfriend?",
                boyfriendEndText: "Have a nice day! :)",
                mainQuestion: "Do you want to go<br>on a date with me?",
                btnYes: "YES",
                btnNo: "NO",
                activityTitle: "What should we do?",
                act1: "☕ Go for a Coffee ☕",
                act2: "🌳 Go for a Walk 🌳",
                formTitle: "Just one last step...",
                labelName: "Your Name",
                placeholderName: "Your Name",
                labelAge: "Your Age",
                placeholderAge: "Your Age",
                btnSubmit: "Let's meet!",
                msgPrefix: "Let's",
                toastMsg: "Good choice 😉",
                taunts: [
                    "NO", 
                    "NO", 
                    "NO", 
                    "NO", 
                    "NO", 
                    "NO", 
                    "NO"
                ]
            }
        };

        let tauntIndex = 0;
        let currentLang = "de";
        let selectedActivity = "";

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.textContent = text;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function setLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];

            document.getElementById('lang-text').textContent = t.langTitle;
            document.getElementById('boyfriend-question').textContent = t.boyfriendQuestion;
            document.getElementById('boyfriend-end-text').textContent = t.boyfriendEndText;
            document.getElementById('btn-bf-ja').textContent = t.btnYes;
            document.getElementById('btn-bf-nein').textContent = t.btnNo;

            document.getElementById('main-question').innerHTML = t.mainQuestion;
            document.getElementById('btn-ja-1').textContent = t.btnYes;
            document.getElementById('text-no').textContent = t.btnNo;
            document.getElementById('activity-title').textContent = t.activityTitle;
            document.getElementById('activity-1-text').textContent = t.act1;
            document.getElementById('activity-2-text').textContent = t.act2;
            document.getElementById('form-title').textContent = t.formTitle;
            document.getElementById('label-name').textContent = t.labelName;
            document.getElementById('nameInput').placeholder = t.placeholderName;
            document.getElementById('label-age').textContent = t.labelAge;
            document.getElementById('ageInput').placeholder = t.placeholderAge;
            document.getElementById('btn-submit').textContent = t.btnSubmit;

            document.getElementById('language-selection').style.display = 'none';
            document.getElementById('main-content').style.display = 'flex';
            
            const screenBf = document.getElementById('screen-boyfriend');
            screenBf.style.display = 'flex';
            screenBf.style.flexDirection = 'column';
            screenBf.style.alignItems = 'center';
        }

        function handleBoyfriendYes() {
            document.getElementById('screen-boyfriend').style.display = 'none';
            document.getElementById('screen-boyfriend-end').style.display = 'block';
        }

        function handleBoyfriendNo() {
            document.getElementById('screen-boyfriend').style.display = 'none';
            const screen1 = document.getElementById('screen-1');
            screen1.style.display = 'flex';
            screen1.style.flexDirection = 'column';
            screen1.style.alignItems = 'center';
        }

        function handleYes() {
            showToast(translations[currentLang].toastMsg);

            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                shapes: ['heart'],
                colors: ['#ff69b4', '#ff1493', '#ff82ab', '#ff66b2', '#ffb8c2'],
                scalar: 1.2,
                drift: 0.5,
                ticks: 300
            });

            showActivitySelection();
        }

        function flinchNein() {
            const btn = document.getElementById('btnNein');
            
            if (btn.style.position !== 'fixed') {
                btn.style.position = 'fixed';
            }

            const rect = btn.getBoundingClientRect();
            createSplash(rect.left + rect.width / 2, rect.top + rect.height / 2);

            const padding = 30;
            const btnWidth = btn.offsetWidth || 120;
            const btnHeight = btn.offsetHeight || 50;
            
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;

            const randomX = Math.max(padding, Math.random() * maxX);
            const randomY = Math.max(padding, Math.random() * maxY);

            const currentTaunts = translations[currentLang].taunts;
            document.getElementById('text-no').textContent = currentTaunts[tauntIndex];
            tauntIndex = (tauntIndex + 1) % currentTaunts.length;

            btn.style.left = randomX + 'px';
            btn.style.top = randomY + 'px';

            const r1 = Math.floor(30 + Math.random() * 40);
            const r2 = Math.floor(30 + Math.random() * 40);
            const r3 = Math.floor(30 + Math.random() * 40);
            const r4 = Math.floor(30 + Math.random() * 40);
            btn.style.borderRadius = `${r1}% ${100-r1}% ${r2}% ${100-r2}% / ${r3}% ${r4}% ${100-r4}% ${100-r3}%`;

            btn.style.transform = `scaleX(1.3) scaleY(0.7) rotate(${Math.random() * 30 - 15}deg)`;
            
            setTimeout(() => {
                btn.style.transform = 'scale(1) rotate(0deg)';
            }, 120);
        }

        function createSplash(x, y) {
            const splash = document.createElement('div');
            splash.className = 'water-splash';
            splash.style.left = (x - 20) + 'px';
            splash.style.top = (y - 20) + 'px';
            document.body.appendChild(splash);
            setTimeout(() => splash.remove(), 400);
        }

        document.addEventListener('mousemove', (e) => {
            const screen1 = document.getElementById('screen-1');
            if (screen1.style.display === 'none') return;

            const btn = document.getElementById('btnNein');
            const rect = btn.getBoundingClientRect();
            
            const btnX = rect.left + rect.width / 2;
            const btnY = rect.top + rect.height / 2;
            
            const distance = Math.hypot(e.clientX - btnX, e.clientY - btnY);
            
            if (distance < 90) {
                flinchNein();
            }
        });

        function showActivitySelection() {
            document.getElementById('screen-1').style.display = 'none';
            const screen2 = document.getElementById('screen-2');
            screen2.style.display = 'flex';
            screen2.style.flexDirection = 'column';
            screen2.style.alignItems = 'center';
            screen2.style.animation = 'fadeIn 0.5s ease';
        }

        function selectActivity(type) {
            if(type === 'cafe') selectedActivity = translations[currentLang].act1;
            if(type === 'walk') selectedActivity = translations[currentLang].act2;

            document.getElementById('screen-2').style.display = 'none';
            document.getElementById('form-view').style.display = 'block';
        }

        function submitAndRedirect() {
            const name = document.getElementById('nameInput').value;
            const age = document.getElementById('ageInput').value;

            if(!name || !age) {
                showToast(currentLang === 'de' ? "Bitte alles ausfüllen! 😘" : "Please fill out everything! 😘");
                return;
            }

            const myNumber = "491606737216"; 
            
            const message = `Hi! Ich bin ${name} (${age}).\n\n${translations[currentLang].msgPrefix} ${selectedActivity}! 😍`;
            
            const encodedMessage = encodeURIComponent(message);
            const whatsappUrl = `https://wa.me/${myNumber}?text=${encodedMessage}`;

            window.location.href = whatsappUrl;
        }
    </script>
</body>
</html>
